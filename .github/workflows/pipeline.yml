name: Witness SBOM Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uk-jake/witness-sbom-pipeline:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run pipeline
        run: ${{ github.workspace }}/pipeline.sh

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: attestation
          path: /pipeline/attestation.json

      - name: Upload SBOM (SPDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: /pipeline/sbom-spdx.json

      - name: Upload SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cdx
          path: /pipeline/sbom-cdx.json
